[package]
name = "hackysack"
version = "1.0.0"
description = "HackySack — AI Interview Assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "hackysack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
once_cell = "1"

# Audio capture & WAV encoding
cpal = "0.15"
hound = "3.5"

# Neural Voice Activity Detection (pure Rust, no ONNX runtime needed)
earshot = "1"

# Document parsing (DOCX, PDF)
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.32"
pdf-extract = "0.7"
regex = "1"
base64 = "0.22"
screenshots = "0.8"
